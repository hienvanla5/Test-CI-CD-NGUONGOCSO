name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  BACKEND_DIR: ./backend   # Thay đổi nếu backend nằm ở thư mục khác
  FRONTEND_DIR: ./frontend # Thay đổi nếu frontend nằm ở thư mục khác

jobs:
  # ---------- JOB 1: Build Backend (Maven) ----------
  build-backend:
    name: Build Spring Boot (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ${{ env.BACKEND_DIR }}
        run: mvn clean package -DskipTests   # Bỏ test nếu chưa có

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ${{ env.BACKEND_DIR }}/target/*.jar
          retention-days: 7

  # ---------- JOB 2: Build Frontend ----------
  build-frontend:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build React
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_DIR }}/dist/   # hoặc build/
          retention-days: 7

  # ---------- JOB 3: Deploy via SCP ----------
  deploy-via-scp:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    # Chỉ chạy nếu bạn đã cấu hình secrets
    # Có thể comment hoặc xóa job này nếu chưa có server

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./backend-artifact

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-artifact

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Backend
        run: |
          # Tạo thư mục nếu chưa có
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
              "mkdir -p /home/${{ secrets.SERVER_USER }}/app"
          # Copy jar
          scp -o StrictHostKeyChecking=no \
              ./backend-artifact/*.jar \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SERVER_USER }}/app/backend.jar
          # Restart service (nếu dùng systemd)
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
              "sudo systemctl restart backend-service"

      - name: Deploy Frontend
        run: |
          # Xóa file cũ và copy mới
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
              "sudo rm -rf /var/www/html/*"
          scp -r -o StrictHostKeyChecking=no \
              ./frontend-artifact/* \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/html/

  # ---------- JOB 4: Build and Push Docker Image (Tùy chọn) ----------
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    # Bỏ comment nếu bạn dùng Docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/myapp:latest
            ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max