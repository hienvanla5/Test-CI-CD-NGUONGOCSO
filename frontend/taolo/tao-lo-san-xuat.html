<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tạo lô sản xuất</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f5f2;
    margin: 0;
    padding: 40px 16px;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 24px 28px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 13px;
    color: #666;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #444;
    margin-bottom: 4px;
  }
  select, input {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
  }
  button {
    height: 36px;
    padding: 0 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid #ccc;
    background: #fff;
  }
  button.primary {
    background: #2f7a4a;
    border-color: #2f7a4a;
    color: #fff;
  }
  .error {
    color: #b3261e;
    font-size: 12px;
    margin: -12px 0 12px;
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Tạo lô sản xuất</h1>
  <p class="subtitle">Lô sẽ được tạo ở trạng thái nháp</p>

  <form id="lotForm">
    <label for="cultivationArea">Vùng trồng</label>
    <select id="cultivationArea" name="cultivationArea" required>
      <option value="">-- Chọn vùng trồng --</option>
      <option value="1">Vùng trồng A - Tân Cương</option>
      <option value="2">Vùng trồng B - Đại Từ</option>
    </select>

    <label for="cropType">Loại nông sản</label>
    <input type="text" id="cropType" name="cropType" placeholder="Chè xanh" required>

    <div class="row">
      <div>
        <label for="expectedQuantity">Sản lượng dự kiến (kg)</label>
        <input type="number" id="expectedQuantity" name="expectedQuantity" placeholder="500" min="0" step="0.1" required>
      </div>
      <div>
        <label for="season">Thời vụ</label>
        <input type="text" id="season" name="season" placeholder="Vụ xuân 2026" required>
      </div>
    </div>

    <p class="error" id="errorMsg">Vui lòng nhập đầy đủ thông tin bắt buộc.</p>

    <div class="actions">
      <button type="reset">Huỷ</button>
      <button type="submit" class="primary">Tạo lô</button>
    </div>
  </form>
</div>

<script>
  document.getElementById('lotForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var data = Object.fromEntries(new FormData(this));
    if (!data.cultivationArea || !data.cropType || !data.expectedQuantity || !data.season) {
      document.getElementById('errorMsg').style.display = 'block';
      return;
    }
    document.getElementById('errorMsg').style.display = 'none';
    console.log('Dữ liệu tạo lô:', data);
    alert('Đã tạo lô (test): ' + JSON.stringify(data, null, 2));
  });
</script>

</body>
</html>
