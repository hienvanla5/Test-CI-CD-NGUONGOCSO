<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Lô Sản Xuất - Nguồn Gốc Số</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f1f8e9;
            --text-color: #37474f;
            --error-color: #c62828;
            --border-color: #cfd8dc;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 550px;
            width: 100%;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #78909c;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .user-info {
            background: #e8f5e9;
            border-left: 4px solid var(--primary-color);
            padding: 10px 15px;
            font-size: 13px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(46, 125, 50, 0.2);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.btn-cancel {
            background: #cfd8dc;
            color: #37474f;
        }

        button.btn-cancel:hover {
            background: #b0bec5;
        }

        button.btn-submit {
            background: var(--primary-color);
            color: white;
        }

        button.btn-submit:hover {
            background: var(--primary-hover);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: #ffebee;
            color: var(--error-color);
            border: 1px solid #ffcdd2;
        }

        .alert-success {
            background: #e8f5e9;
            color: var(--primary-color);
            border: 1px solid #c8e6c9;
        }

        .result-box {
            margin-top: 20px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 15px;
            font-size: 12px;
            display: none;
        }

        .result-box pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tạo Lô Sản Xuất Mới</h2>
    <p class="subtitle">Nhập thông tin chi tiết để khởi tạo lô sản xuất dạng nháp</p>

    <div id="userInfo" class="user-info">Đang kiểm tra quyền đăng nhập...</div>

    <div id="alertError" class="alert alert-error"></div>
    <div id="alertSuccess" class="alert alert-success"></div>

    <form id="productionLotForm">
        <div class="form-group">
            <label for="name">Tên lô sản xuất *</label>
            <input type="text" id="name" required placeholder="Ví dụ: Lô xoài cát chu xuất khẩu đợt 1">
        </div>

        <div class="form-group">
            <label for="productCategoryId">Loại nông sản *</label>
            <select id="productCategoryId" required>
                <option value="">-- Chọn loại nông sản --</option>
                <option value="44444444-4444-4444-4444-444444444444">Xoài Cát Chu (Seed mẫu)</option>
                <!-- Frontend thật sẽ load động danh sách từ API GET /product-categories -->
            </select>
        </div>

        <div class="form-group">
            <label for="farmAreaId">Khu vực canh tác (Vùng trồng)</label>
            <select id="farmAreaId">
                <option value="">-- Không chọn (Mặc định để trống) --</option>
                <option value="55555555-5555-5555-5555-555555555555">Khu vực canh tác A1 (Seed mẫu)</option>
                <!-- Frontend thật sẽ load động danh sách từ API GET /farm-areas -->
            </select>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="expectedQuantity">Sản lượng dự kiến (kg) *</label>
                <input type="number" id="expectedQuantity" required min="0.1" step="0.1" placeholder="Ví dụ: 1500">
            </div>

            <div class="form-group">
                <label for="plantingDate">Ngày xuống giống</label>
                <input type="date" id="plantingDate">
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="btn-cancel" onclick="window.history.back()">Hủy bỏ</button>
            <button type="submit" class="btn-submit">Tạo lô sản xuất</button>
        </div>
    </form>

    <div id="resultBox" class="result-box">
        <strong>Kết quả trả về từ Server:</strong>
        <pre id="jsonResult"></pre>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8080/api/v1';

    // 1. Kiểm tra trạng thái đăng nhập
    const accessToken = localStorage.getItem('accessToken');
    const userJson = localStorage.getItem('user');

    if (!accessToken || !userJson) {
        document.getElementById('userInfo').innerHTML = '⚠️ <span style="color:red">Bạn chưa đăng nhập!</span> Vui lòng quay lại trang đăng nhập trước.';
        document.getElementById('productionLotForm').querySelectorAll('input, select, button').forEach(el => el.disabled = true);
    } else {
        const user = JSON.parse(userJson);
        document.getElementById('userInfo').innerHTML = `👤 Tài khoản: <strong>${user.fullName}</strong> | Vai trò: <strong>${user.roleCode}</strong><br>🏢 Tổ chức: <strong>${user.organizationName} (${user.organizationCode})</strong>`;

        // Gán mặc định ngày gieo trồng là ngày hôm nay
        document.getElementById('plantingDate').value = new Date().toISOString().split('T')[0];
    }

    // 2. Gửi request tạo Lô sản xuất
    document.getElementById('productionLotForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        hideAlerts();

        const payload = {
            name: document.getElementById('name').value.trim(),
            productCategoryId: document.getElementById('productCategoryId').value,
            farmAreaId: document.getElementById('farmAreaId').value || null,
            expectedQuantity: parseFloat(document.getElementById('expectedQuantity').value),
            plantingDate: document.getElementById('plantingDate').value || null
        };

        try {
            const response = await fetch(`${API_BASE_URL}/production-lots`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${accessToken}`
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                showSuccess('Tạo lô sản xuất thành công!');
                showResult(result.data);
                document.getElementById('productionLotForm').reset();
                document.getElementById('plantingDate').value = new Date().toISOString().split('T')[0];
            } else {
                // Xử lý lỗi trả về từ Backend
                if (result.errors) {
                    // Trường hợp lỗi Validation (Object list)
                    let errorMsgs = Object.values(result.errors).join('<br>');
                    showError(`Lỗi dữ liệu đầu vào:<br>${errorMsgs}`);
                } else {
                    // Trường hợp lỗi BusinessException
                    showError(result.message || 'Lỗi hệ thống khi tạo lô sản xuất.');
                }
                showResult(result);
            }
        } catch (err) {
            console.error(err);
            showError('Không thể kết nối đến Backend. Hãy đảm bảo Spring Boot đã khởi động thành công.');
        }
    });

    function showError(msg) {
        const el = document.getElementById('alertError');
        el.innerHTML = msg;
        el.style.display = 'block';
    }

    function showSuccess(msg) {
        const el = document.getElementById('alertSuccess');
        el.innerHTML = msg;
        el.style.display = 'block';
    }

    function hideAlerts() {
        document.getElementById('alertError').style.display = 'none';
        document.getElementById('alertSuccess').style.display = 'none';
        document.getElementById('resultBox').style.display = 'none';
    }

    function showResult(data) {
        const box = document.getElementById('resultBox');
        const pre = document.getElementById('jsonResult');
        pre.textContent = JSON.stringify(data, null, 2);
        box.style.display = 'block';
    }
</script>

</body>
</html>
