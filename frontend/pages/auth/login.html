<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập | Nguồn Gốc Số</title>

    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/components/form.css">
    <link rel="stylesheet" href="../../css/components/button.css">
    <link rel="stylesheet" href="../../css/pages/auth/login.css">
</head>

<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="login-header">
                <div class="login-logo" aria-hidden="true">🌱</div>

                <h1 id="loginTitle">Nguồn Gốc Số</h1>
                <p>Đăng nhập để tiếp tục sử dụng hệ thống</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">
                        Tên đăng nhập <span class="required">*</span>
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        aria-describedby="usernameError"
                        required
                    >

                    <small id="usernameError" class="field-error"></small>
                </div>

                <div class="form-group">
                    <label for="password">
                        Mật khẩu <span class="required">*</span>
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        aria-describedby="passwordError"
                        required
                    >

                    <small id="passwordError" class="field-error"></small>
                </div>

                <div class="form-group">
                    <label for="organizationCode">
                        Mã tổ chức
                        <span class="optional-label">(tùy chọn)</span>
                    </label>

                    <input
                        id="organizationCode"
                        name="organizationCode"
                        type="text"
                        autocomplete="organization"
                        aria-describedby="organizationCodeHint"
                    >

                    <small id="organizationCodeHint" class="field-hint">
                        Để trống nếu tài khoản không thuộc tổ chức.
                    </small>
                </div>

                <p
                    id="loginError"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                ></p>

                <button
                    id="loginButton"
                    type="submit"
                    class="btn btn-primary"
                >
                    Đăng nhập
                </button>
            </form>
        </section>
    </main>

    <script
        type="module"
        src="../../js/pages/auth/login.page.js"
    ></script>
</body>

</html>
