<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0">

    <title>
        Admin Dashboard | Nguồn Gốc Số
    </title>

    <link
        rel="stylesheet"
        href="../../css/reset.css">

    <link
        rel="stylesheet"
        href="../../css/variables.css">

    <link
        rel="stylesheet"
        href="../../css/global.css">

    <link
        rel="stylesheet"
        href="../../css/pages/admin.css">

</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">
                Nguồn Gốc Số
            </div>

            <nav class="sidebar-menu">

                <a href="#" class="active">
                    Dashboard
                </a>

                <a href="#">
                    Organizations
                </a>

                <a href="#">
                    Users
                </a>

                <a href="#">
                    System Settings
                </a>

            </nav>

        </aside>

        <main class="dashboard-main">

            <header class="dashboard-header">

                <div>
                    <h1>
                        Admin Dashboard
                    </h1>

                    <p class="text-muted">
                        System management overview
                    </p>
                </div>

                <button
                    id="logoutButton"
                    class="btn">

                    Logout

                </button>

            </header>

            <section class="dashboard-content">

                <div class="stat-grid">

                    <div class="stat-card">
                        <span>
                            Organizations
                        </span>

                        <strong>
                            0
                        </strong>
                    </div>

                    <div class="stat-card">
                        <span>
                            Users
                        </span>

                        <strong>
                            0
                        </strong>
                    </div>

                    <div class="stat-card">
                        <span>
                            Active Organizations
                        </span>

                        <strong>
                            0
                        </strong>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <script
        type="module"
        src="../../js/pages/admin.page.js">
    </script>

</body>

</html>
