<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0">

    <title>
        Farm Area Declaration | Nguồn Gốc Số
    </title>

    <link
        rel="stylesheet"
        href="../../css/reset.css">

    <link
        rel="stylesheet"
        href="../../css/variables.css">

    <link
        rel="stylesheet"
        href="../../css/global.css">

    <link
        rel="stylesheet"
        href="../../css/layouts/dashboard-layout.css">

    <link
        rel="stylesheet"
        href="../../css/components/button.css">

    <link
        rel="stylesheet"
        href="../../css/components/form.css">

    <link
        rel="stylesheet"
        href="../../css/pages/cooperative/dashboard.css">

    <link
        rel="stylesheet"
        href="../../css/pages/cooperative/farm-area-create.css">

</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">
                Nguồn Gốc Số
            </div>

            <nav class="sidebar-menu">

                <a href="/frontend/pages/cooperative/dashboard.html">
                    Dashboard
                </a>

                <a href="/frontend/pages/cooperative/farm-areas/index.html">
                    Farm Areas
                </a>

                <a href="/frontend/pages/cooperative/profile.html">
                    Organization Profile
                </a>

            </nav>

            <div class="sidebar-user" id="sidebarUser">
                <div class="sidebar-user-avatar" id="sidebarUserAvatar"></div>
                <div class="sidebar-user-info">
                    <strong id="sidebarUserName">—</strong>
                    <span id="sidebarUserOrg">—</span>
                </div>
            </div>

        </aside>

        <main class="dashboard-main">

            <header class="dashboard-header">

                <div>
                    <h1>
                        Farm Area Declaration
                    </h1>

                    <p class="text-muted">
                        Khai báo vùng trồng
                    </p>
                </div>

                <div class="header-actions">

                    <div class="user-badge" id="headerUserBadge">
                        <span id="headerUserRole" class="user-role-badge">—</span>
                        <span id="headerUserName">—</span>
                        <span class="user-org-sep">|</span>
                        <span id="headerUserOrg">—</span>
                    </div>

                    <button
                        id="logoutButton"
                        class="btn btn-secondary">

                        Logout

                    </button>

                </div>

            </header>

            <section class="dashboard-content">

                <!-- Loading State -->
                <div id="loadingState" class="state-container" style="display: none;">
                    <div class="state-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 6v6l4 2" />
                        </svg>
                    </div>
                    <p class="state-text">Loading...</p>
                </div>

                <!-- Error State -->
                <div id="errorState" class="state-container" style="display: none;">
                    <div class="state-icon state-error-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="8" x2="12" y2="12" />
                            <line x1="12" y1="16" x2="12.01" y2="16" />
                        </svg>
                    </div>
                    <p id="errorMessage" class="state-text state-error-text">An error occurred.</p>
                    <button id="retryButton" class="btn btn-secondary">Retry</button>
                </div>

                <!-- Unauthorized State -->
                <div id="unauthorizedState" class="state-container" style="display: none;">
                    <div class="state-icon state-error-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </div>
                    <p class="state-text state-error-text">You do not have permission to access this page.</p>
                    <a href="/frontend/pages/auth/login.html" class="btn btn-secondary">Back to Login</a>
                </div>

                <!-- Main Content -->
                <div id="mainContent">

                    <div class="declare-card">

                        <form id="farmAreaForm" novalidate>

                            <!-- Section 1: Basic Farm Area Information -->
                            <section class="declare-section">
                                <h2 class="declare-section-title">Basic Farm Area Information</h2>

                                <div class="declare-field-grid">

                                    <div class="form-group">
                                        <label for="name">
                                            Farm Area Name <span class="required">*</span>
                                        </label>
                                        <input
                                            type="text"
                                            id="name"
                                            name="name"
                                            maxlength="255"
                                            autocomplete="off"
                                            aria-describedby="nameError"
                                            aria-invalid="false"
                                            required
                                        />
                                        <small id="nameError" class="field-error" data-error-for="name"></small>
                                    </div>

                                    <div class="form-group">
                                        <label for="cropType">
                                            Crop Type <span class="required">*</span>
                                        </label>
                                        <select
                                            id="cropType"
                                            name="cropType"
                                            aria-describedby="cropTypeError"
                                            aria-invalid="false"
                                            required
                                        >
                                            <option value="">Select crop type</option>
                                        </select>
                                        <small id="cropTypeError" class="field-error" data-error-for="cropType"></small>
                                    </div>

                                    <div class="form-group">
                                        <label for="area">
                                            Area <span class="required">*</span>
                                        </label>
                                        <input
                                            type="number"
                                            id="area"
                                            name="area"
                                            min="0.01"
                                            step="0.01"
                                            autocomplete="off"
                                            aria-describedby="areaError"
                                            aria-invalid="false"
                                            required
                                        />
                                        <small id="areaError" class="field-error" data-error-for="area"></small>
                                    </div>

                                </div>
                            </section>

                            <!-- Section 2: Geographic Location -->
                            <section class="declare-section">
                                <h2 class="declare-section-title">Geographic Location</h2>

                                <div class="declare-field-grid">

                                    <div class="form-group">
                                        <label for="latitude">
                                            Latitude <span class="required">*</span>
                                        </label>
                                        <input
                                            type="number"
                                            id="latitude"
                                            name="latitude"
                                            min="-90"
                                            max="90"
                                            step="any"
                                            autocomplete="off"
                                            aria-describedby="latitudeError"
                                            aria-invalid="false"
                                            required
                                        />
                                        <small id="latitudeError" class="field-error" data-error-for="latitude"></small>
                                    </div>

                                    <div class="form-group">
                                        <label for="longitude">
                                            Longitude <span class="required">*</span>
                                        </label>
                                        <input
                                            type="number"
                                            id="longitude"
                                            name="longitude"
                                            min="-180"
                                            max="180"
                                            step="any"
                                            autocomplete="off"
                                            aria-describedby="longitudeError"
                                            aria-invalid="false"
                                            required
                                        />
                                        <small id="longitudeError" class="field-error" data-error-for="longitude"></small>
                                    </div>

                                </div>
                            </section>

                            <!-- Form message -->
                            <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

                            <!-- Actions -->
                            <div class="declare-actions">

                                <button
                                    type="button"
                                    id="cancelButton"
                                    class="btn btn-secondary btn-cancel">
                                    Cancel
                                </button>

                                <button
                                    type="submit"
                                    id="submitButton"
                                    class="btn btn-primary btn-create">
                                    Create Farm Area
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script
        type="module"
        src="../../js/pages/cooperative/farm-area-create.page.js">
    </script>

</body>

</html>
