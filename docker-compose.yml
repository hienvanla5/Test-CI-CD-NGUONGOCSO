name: nguongocso

services:
  mysql:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    container_name: nguongocso-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-nguon_goc_so}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nguongocso-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nguongocso-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-nguon_goc_so}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-Q29uZmlndXJlACB1cTVyTG9uZ1NlY3JldEtleUZvckpXVDI1NkJpdA==}
      APP_BACKUP_MYSQL_DUMP_PATH: mysqldump
      APP_BACKUP_MYSQL_PATH: mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./files:/app/files
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - nguongocso-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
        VITE_ASSET_BASE_URL: ${VITE_ASSET_BASE_URL:-http://localhost:8080}
    container_name: nguongocso-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nguongocso-net

volumes:
  mysql_data:
    name: nguongocso_mysql_data

networks:
  nguongocso-net:
    driver: bridge